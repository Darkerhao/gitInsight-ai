name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/checks.yml

  prepare:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.version.outputs.ready }}
      ref: ${{ steps.version.outputs.ref }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare package version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main; its workflow will release it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm version patch --no-git-tag-version --ignore-scripts
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): $tag"
          git tag "$tag"
          # Publish both refs together; never overwrite a newer main commit.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    name: Package ${{ matrix.name }} ${{ matrix.editionLabel }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            edition: lite
            editionLabel: Lite
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: MajiAI-Lite-Windows
            paths: |
              release/*/lite/MajiAI-*.exe
              release/*/lite/MajiAI-*.zip
              release/*/lite/MajiAI-*.blockmap
              release/*/lite/lite.yml
          - name: Windows
            edition: standard
            editionLabel: Standard
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: MajiAI-Standard-Windows
            paths: |
              release/*/standard/MajiAI-*.exe
              release/*/standard/MajiAI-*.zip
              release/*/standard/MajiAI-*.blockmap
              release/*/standard/standard.yml
          - name: macOS
            edition: lite
            editionLabel: Lite
            os: macos-latest
            script: npm run dist:mac -- --publish never
            artifact: MajiAI-Lite-macOS
            paths: |
              release/*/lite/MajiAI-*.dmg
              release/*/lite/MajiAI-*.zip
              release/*/lite/MajiAI-*.blockmap
              release/*/lite/lite-mac.yml
          - name: macOS
            edition: standard
            editionLabel: Standard
            os: macos-latest
            script: npm run dist:mac -- --publish never
            artifact: MajiAI-Standard-macOS
            paths: |
              release/*/standard/MajiAI-*.dmg
              release/*/standard/MajiAI-*.zip
              release/*/standard/MajiAI-*.blockmap
              release/*/standard/standard-mac.yml
          - name: Linux
            edition: lite
            editionLabel: Lite
            os: ubuntu-latest
            script: npm run dist:linux -- --publish never
            artifact: MajiAI-Lite-Linux
            paths: |
              release/*/lite/MajiAI-*.AppImage
              release/*/lite/MajiAI-*.deb
              release/*/lite/MajiAI-*.rpm
              release/*/lite/MajiAI-*.tar.gz
              release/*/lite/MajiAI-*.blockmap
              release/*/lite/lite-linux.yml
          - name: Linux
            edition: standard
            editionLabel: Standard
            os: ubuntu-latest
            script: npm run dist:linux -- --publish never
            artifact: MajiAI-Standard-Linux
            paths: |
              release/*/standard/MajiAI-*.AppImage
              release/*/standard/MajiAI-*.deb
              release/*/standard/MajiAI-*.rpm
              release/*/standard/MajiAI-*.tar.gz
              release/*/standard/MajiAI-*.blockmap
              release/*/standard/standard-linux.yml

    env:
      APP_EDITION: ${{ matrix.edition }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Build packages
        run: ${{ matrix.script }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [prepare, package]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: MajiAI-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            release-assets/**/MajiAI-*
            release-assets/**/lite*.yml
            release-assets/**/standard*.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
