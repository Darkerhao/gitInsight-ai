name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  prepare:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.version.outputs.ready }}
      ref: ${{ steps.version.outputs.ref }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare package version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main; its workflow will release it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm version patch --no-git-tag-version --ignore-scripts
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): $tag"
          git tag "$tag"
          # Publish both refs together; never overwrite a newer main commit.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  sync-dev:
    name: Sync version commit to dev
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - name: Cherry-pick version commit
        id: sync
        env:
          VERSION_COMMIT: ${{ needs.prepare.outputs.ref }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git checkout --detach origin/dev
          if ! git cherry-pick -x --empty=drop "$VERSION_COMMIT"; then
            git cherry-pick --abort
            echo "::error::Version sync conflicted. Resolve the version commit on dev, then re-run failed jobs."
            exit 1
          fi
          # Reject concurrent dev changes instead of overwriting them.
          git push origin HEAD:refs/heads/dev

  package:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: MajiAI-Windows
            paths: |
              release/*/MajiAI-*.exe
              release/*/MajiAI-*.zip
              release/*/MajiAI-*.blockmap
              release/*/standard.yml
          - name: macOS
            os: macos-latest
            script: npm run dist:mac -- --publish never
            artifact: MajiAI-macOS
            paths: |
              release/*/MajiAI-*.dmg
              release/*/MajiAI-*.zip
              release/*/MajiAI-*.blockmap
              release/*/standard-mac.yml
          - name: Linux
            os: ubuntu-latest
            script: npm run dist:linux -- --publish never
            artifact: MajiAI-Linux
            paths: |
              release/*/MajiAI-*.AppImage
              release/*/MajiAI-*.deb
              release/*/MajiAI-*.rpm
              release/*/MajiAI-*.tar.gz
              release/*/MajiAI-*.blockmap
              release/*/standard-linux.yml

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Build packages
        run: ${{ matrix.script }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [prepare, package]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: MajiAI-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            release-assets/**/MajiAI-*
            release-assets/**/standard*.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
